
name: ATACseq2tracks
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # ── Core alignment & processing ───────────────────────────────────────────
  - python=3.11
  - bowtie2>=2.5
  - samtools>=1.17
  - bedtools>=2.31
  - trim-galore>=0.6.10
  - fastqc>=0.12
  - picard>=3.1
  - ucsc-bedgraphtobigwig

  # ── Peak calling ──────────────────────────────────────────────────────────
  # MACS3 is invoked with the macs3 executable; legacy script names are retained.
  - macs3>=3.0

  # ── QC & reporting ───────────────────────────────────────────────────────
  - multiqc>=1.18
  - ataqv>=1.3

  # ── deepTools — NEW: required for Step 10 post_alignment_qc_batch.sh ─────
  - deeptools>=3.5

  # ── Python plotting — NEW: required for plot_chrom_coverage.py ───────────
  - matplotlib>=3.7
  - numpy>=1.24
  - pandas>=2.0

  # ── R base ───────────────────────────────────────────────────────────────
  - r-base>=4.3

  # ── Bioconductor ─────────────────────────────────────────────────────────
  # DESeq2 is required for consensus-peak scaling. ChIPQC is no longer used.
  - bioconductor-deseq2
  - bioconductor-diffbind
  - bioconductor-biocparallel
  - bioconductor-genomicalignments
  - bioconductor-rtracklayer

  # ── R packages ───────────────────────────────────────────────────────────
  - r-ggplot2
  - r-dplyr
