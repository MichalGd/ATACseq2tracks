<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="760" viewBox="0 0 1340 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#333333; stroke-width:2; rx:14; }
      .stage { font-family: Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; fill:#111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size:13px; fill:#222222; }
      .arrow { stroke:#333333; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .note { fill:#f7f7f7; stroke:#777777; stroke-width:1.5; rx:10; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size:28px; font-weight:700; fill:#111111; }
    </style>
  </defs>
  <text x="40" y="44" class="title">fastq2tracks 2.1: paired-end Illumina FASTQ to normalized genome-browser tracks</text>

  <rect x="40" y="85" width="210" height="82" class="box"/>
  <text x="62" y="120" class="stage">Raw FASTQ pairs</text>
  <text x="62" y="145" class="small">*_1.fq.gz / *_2.fq.gz</text>

  <rect x="310" y="70" width="210" height="62" class="box"/>
  <text x="340" y="106" class="stage">FastQC raw</text>
  <rect x="310" y="155" width="210" height="62" class="box"/>
  <text x="334" y="191" class="stage">Trim Galore</text>

  <rect x="580" y="155" width="210" height="62" class="box"/>
  <text x="610" y="191" class="stage">Trimmed FASTQ</text>
  <rect x="580" y="70" width="210" height="62" class="box"/>
  <text x="608" y="106" class="stage">FastQC trimmed</text>

  <rect x="850" y="115" width="210" height="92" class="box"/>
  <text x="900" y="150" class="stage">Bowtie2</text>
  <text x="884" y="174" class="small">hg38 or mm39 index</text>
  <text x="884" y="193" class="small">dovetail paired-end</text>

  <rect x="1110" y="115" width="190" height="92" class="box"/>
  <text x="1160" y="150" class="stage">BAM</text>
  <text x="1130" y="174" class="small">sorted_stChr.bam</text>
  <text x="1130" y="193" class="small">alignment metrics</text>

  <rect x="40" y="300" width="210" height="82" class="box"/>
  <text x="74" y="335" class="stage">Read groups</text>
  <text x="64" y="360" class="small">samtools addreplacerg</text>

  <rect x="310" y="300" width="210" height="82" class="box"/>
  <text x="382" y="335" class="stage">Picard</text>
  <text x="350" y="360" class="small">MarkDuplicates</text>

  <rect x="580" y="300" width="210" height="82" class="box"/>
  <text x="616" y="335" class="stage">Dedup BAM</text>
  <text x="610" y="360" class="small">*_dedup.bam + .bai</text>

  <rect x="850" y="290" width="210" height="102" class="box"/>
  <text x="895" y="324" class="stage">Coverage</text>
  <text x="884" y="348" class="small">bedtools genomecov</text>
  <text x="884" y="367" class="small">raw + RPM-normalized</text>

  <rect x="1110" y="290" width="190" height="102" class="box"/>
  <text x="1162" y="324" class="stage">Tracks</text>
  <text x="1132" y="348" class="small">bedGraph</text>
  <text x="1132" y="367" class="small">BigWig</text>

  <rect x="40" y="520" width="240" height="96" class="note"/>
  <text x="70" y="552" class="stage">MultiQC reports</text>
  <text x="64" y="578" class="small">raw, trimmed, alignment,</text>
  <text x="64" y="597" class="small">deduplication summaries</text>

  <rect x="350" y="520" width="240" height="96" class="note"/>
  <text x="390" y="552" class="stage">UCSC tracks</text>
  <text x="382" y="578" class="small">ucsc_tracks.txt</text>
  <text x="382" y="597" class="small">bigwig_summary.txt</text>

  <rect x="660" y="520" width="270" height="96" class="note"/>
  <text x="692" y="552" class="stage">Final reports</text>
  <text x="690" y="578" class="small">pipeline report and</text>
  <text x="690" y="597" class="small">unified MultiQC HTML</text>

  <path d="M250 126 L310 101" class="arrow"/>
  <path d="M250 126 L310 186" class="arrow"/>
  <path d="M520 186 L580 186" class="arrow"/>
  <path d="M685 155 L685 132" class="arrow"/>
  <path d="M790 186 L850 161" class="arrow"/>
  <path d="M1060 161 L1110 161" class="arrow"/>
  <path d="M1205 207 C1205 245 145 245 145 300" class="arrow"/>
  <path d="M250 341 L310 341" class="arrow"/>
  <path d="M520 341 L580 341" class="arrow"/>
  <path d="M790 341 L850 341" class="arrow"/>
  <path d="M1060 341 L1110 341" class="arrow"/>
  <path d="M415 132 C415 455 160 455 160 520" class="arrow"/>
  <path d="M685 132 C685 455 160 455 160 520" class="arrow"/>
  <path d="M955 207 C955 455 160 455 160 520" class="arrow"/>
  <path d="M685 382 C685 455 160 455 160 520" class="arrow"/>
  <path d="M1205 392 C1205 455 470 455 470 520" class="arrow"/>
  <path d="M470 616 L660 568" class="arrow"/>
  <path d="M280 568 L660 568" class="arrow"/>
</svg>
