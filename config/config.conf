#!/usr/bin/env bash
# =============================================================================
# ATACseq2tracks v3.1.0 — Main configuration file
#
# This is the ONLY file you need to edit before each run.
# It can live ANYWHERE on the server (your project folder).
#
# Usage:
#   bash /path/to/ATACseq2tracks/atacseq2tracks.sh --config /path/to/config.conf
#
# All run-specific settings — samplesheet, output dir, and resources —
# are defined here. No other arguments are needed at the command line.
# =============================================================================

# ── PER-RUN settings — change these before every run ─────────────────────────

# Absolute path to your samplesheet for this run
SAMPLESHEET="/home/micgdu/myproject/config/samplesheet.csv"

# Absolute path to the output directory (will be created if it does not exist)
OUTPUT_DIR="/data/results/myproject_run1"

# Max parallel samples per batch stage (tune to server load; 8 is safe default)
THREADS_PARALLEL_JOBS=8

# ── Server-wide reference data ── shared paths; change only if data moves ────

INDEX_HG38="/home/micgdu/GenomicData/genomicIndices/hsapiens/bowtie2/hg38"
INDEX_MM39="/home/micgdu/GenomicData/genomicIndices/Mmusculus/bowtie2/mm39"

GTF_HUMAN="/home/micgdu/GenomicData/genomesDec2022/gencode.v42.primary_assembly.annotation.gtf"
CHROM_SIZES_HUMAN="/home/micgdu/GenomicData/genomesDec2022/hs38n.chrom.sizes"
GTF_MOUSE="/home/micgdu/GenomicData/genomesDec2022/gencode.vM31.primary_assembly.annotation.gtf"
CHROM_SIZES_MOUSE="/home/micgdu/GenomicData/genomesDec2022/mm39n.chrom.sizes"

BLACKLIST_HG38="/home/micgdu/data/shared/AnnotationHub_cache/blacklist_hg38_ENCFF356LFX.bed"
BLACKLIST_MM39="/home/micgdu/data/shared/AnnotationHub_cache/blacklist_mm39_Boyle.bed"

# ── ChIPQC R objects — DEPRECATED as of v3.1.0 ───────────────────────────────
# Step 10 (post-alignment QC) now uses deepTools and no longer reads these files.
# These variables are kept for reference and backward compatibility only.
# They may be safely removed from your project config.conf.
# See docs/10_reference_files.md for legacy build instructions.
#
# CHIPQC_ANNOTATION_HG38="/home/micgdu/data/shared/AnnotationHub_cache/anno_hg38_chipqc.rds"
# CHIPQC_ANNOTATION_MM39="/home/micgdu/data/shared/AnnotationHub_cache/anno_mm39_chipqc.rds"
# CHIPQC_BLACKLIST_HG38_RDS="/home/micgdu/data/shared/AnnotationHub_cache/blacklist_hg38.rds"
# CHIPQC_BLACKLIST_MM39_RDS="/home/micgdu/data/shared/AnnotationHub_cache/blacklist_mm39.rds"

# ── Software paths ────────────────────────────────────────────────────────────
PICARD_JAR="/home/micgdu/software/picard.jar"
PICARD_XMX="-Xmx32G"
PICARD_OPTICAL_DISTANCE=100
PICARD_TMP="/tmp/picard_tmp"
BEDGRAPH_TO_BIGWIG="/home/micgdu/kentutils/bedGraphToBigWig"
R_BIN="Rscript"
CONDA_ENV_ACTIVATE=""   # leave empty if conda env is already active

# ── MACS3 parameters ─────────────────────────────────────────────────────────
MACS2_GENOME_HG38="hs"
MACS2_GENOME_MM39="mm"
MACS2_QVALUE=0.05
MACS2_BROAD_CUTOFF=0.1

# ── Thread settings (server: 70 physical / 140 logical / 500 GB RAM) ─────────
THREADS_ALIGN=16
THREADS_SAMTOOLS=16
THREADS_FASTQC=10
THREADS_TRIMGALORE=8
THREADS_BIGWIG=16

# deepTools workers — used by Step 10 (post_alignment_qc_batch.sh)
# multiBamSummary, bamCoverage, computeMatrix all respect this value
THREADS_DEEPTOOLS=16

# ── Cleanup ───────────────────────────────────────────────────────────────────
KEEP_INTERMEDIATE_BAMS=false
KEEP_TRIMMED_FASTQ=false
